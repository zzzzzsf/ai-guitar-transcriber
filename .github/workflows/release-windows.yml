name: release-windows

# Windows 原生版发布流水线（方案 §8.5）
# 推 tag（v*）→ 构建 → minisign 签名更新包 → Draft Release（NSIS + portable 绿色版 + latest.json）
# 只发 NSIS 一种安装器格式——NSIS/MSI 混装会把更新装错目录（§8.1 硬规则）

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      # fetch-depth: 0 + fetch-tags：W15-1 的 git diff 需要 app-baseline tag（浅克隆里不存在）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖（不给 app/package.json 加任何 tauri 依赖——CLI 走 npx/tauri-action）
        working-directory: app
        run: npm ci

      - name: 前端回归测试
        working-directory: app
        run: npm test

      - name: Rust 回归测试
        working-directory: src-tauri
        run: cargo test --locked

      - name: 发布基线检查回归测试
        run: node --test src-tauri/scripts/check-w15-scope.test.mjs src-tauri/scripts/check-release-tag.test.mjs

      - name: 版本三处同源校验（app/package.json = tauri.conf.json = Cargo.toml）
        shell: bash
        run: bash src-tauri/scripts/check-versions.sh

      # ---- 首发三件套终审（§8.3/§11.2 R1+R2）：烧进二进制的 endpoint/pubkey/identifier，
      #      占位符或开发钥检出即 fail——错过首发窗口，纠正成本 = 全体用户手动重装 ----
      - name: 首发三件套终审（endpoint 占位符 / identifier / 开发钥拦截）
        shell: bash
        run: bash src-tauri/scripts/release-gate.sh

      - name: 发布元数据无 shell 等价检查（Git Bash 受限环境的兜底）
        run: node src-tauri/scripts/check-release-metadata.mjs

      # ---- W15 基线（§10）：直建一次，记录 app 源码与 dist 产物哈希 ----
      - name: W15 基线（app 源码哈希 + 直接构建的 dist 哈希）
        shell: bash
        run: |
          find app -type f ! -path "app/node_modules/*" ! -path "app/dist/*" -print0 \
            | sort -z | xargs -0 sha256sum > /tmp/app-src-before.sha256
          npm --prefix app run build
          find app/dist -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/dist-before.sha256

      # ---- 手动全量构建一次（CLI 钉 2.12.4，§3.1/R5：与 CI 所用版本对齐防漂移），
      #      在此完成验证门禁：验证不通过则整个 job 失败，不会创建任何 Release ----
      - name: 全量构建（NSIS + 签名更新包）
        working-directory: src-tauri
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2.12.4 build

      - name: W15 验证（app 零改动 + 前端产物 hash 一致）——Release 创建前的门禁
        shell: bash
        run: |
          # 口径①（git diff）：历史版本元数据与本轮修复使用明确文件白名单。
          # 白名单外任何 app/ 改动仍失败，不做整目录永久解冻。
          node src-tauri/scripts/check-w15-scope.mjs app-baseline

          find app -type f ! -path "app/node_modules/*" ! -path "app/dist/*" -print0 \
            | sort -z | xargs -0 sha256sum > /tmp/app-src-after.sha256
          diff /tmp/app-src-before.sha256 /tmp/app-src-after.sha256 \
            && echo "W15-1b OK: 构建过程 app/ 哈希前后一致"
          find app/dist -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/dist-after.sha256
          diff /tmp/dist-before.sha256 /tmp/dist-after.sha256 \
            && echo "W15-2 OK: 装进安装器的前端与直建产物 hash 一致"
          # 观察项（§11.1）：W15② 依赖 Vite 构建确定性；若偶发不一致，排查非确定性来源
          # （chunk 哈希、生成时间戳等），不得借机放宽为零改动承诺。

      - name: 安装包体积门禁（§10 性能门禁 / §11.2 R4：NSIS ≤ 25MB，不含模型权重）
        shell: bash
        run: |
          setup=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
          size=$(stat -c %s "$setup")
          echo "NSIS 体积：$((size / 1024 / 1024)) MiB（$size 字节）"
          if [ "$size" -gt 26214400 ]; then
            echo "::error::安装包超过 25MB 性能门禁（§10）：$setup" >&2
            exit 1
          fi

      - name: 准备便携版及许可声明（公开前）
        shell: pwsh
        run: |
          $exe = Get-Item -LiteralPath 'src-tauri/target/release/guitar.exe'
          $stage = Join-Path (Get-Location).Path 'portable-stage'
          if (Test-Path -LiteralPath $stage) { throw 'portable stage already exists' }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -LiteralPath $exe.FullName -Destination (Join-Path $stage 'AI 智能扒谱.exe')
          Copy-Item -LiteralPath 'src-tauri/THIRD-PARTY-NOTICES-RUST.txt' -Destination $stage
          Copy-Item -LiteralPath 'app/THIRD-PARTY-NOTICES.txt' -Destination $stage
          $version = node -p "require('./app/package.json').version"
          Copy-Item -LiteralPath "docs/releases/v$version.md" -Destination (Join-Path $stage 'README.md')
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath 'portable-windows-x64.zip'

      - name: 创建草稿并上传完整资产（禁止覆盖既有版本）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./app/package.json').version")
          TAG="v$VERSION"
          test "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)"
          BUNDLE="src-tauri/target/release/bundle/nsis"
          EXE_NAME="AI-Guitar-Transcriber_${VERSION}_x64-setup.exe"
          mapfile -t SETUPS < <(find "$BUNDLE" -maxdepth 1 -type f -name '*-setup.exe')
          test "${#SETUPS[@]}" -eq 1
          SETUP="${SETUPS[0]}"
          if [ "$SETUP" != "$BUNDLE/$EXE_NAME" ]; then
            cp "$SETUP" "$BUNDLE/$EXE_NAME"
            cp "$SETUP.sig" "$BUNDLE/$EXE_NAME.sig"
          fi
          cp portable-windows-x64.zip "$BUNDLE/portable-windows-x64.zip"
          node -e '
            const fs = require("fs");
            const [version, exe, repo, dir] = process.argv.slice(1);
            const signature = fs.readFileSync(`${dir}/${exe}.sig`, "utf8").trim();
            if (!signature) throw new Error("Missing updater signature");
            const json = {
              version,
              notes: "变更说明见 Release 页。",
              pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": {
                signature,
                url: `https://github.com/${repo}/releases/download/v${version}/${exe}`
              }}
            };
            fs.writeFileSync(`${dir}/latest.json`, JSON.stringify(json, null, 2) + "\n");
            const crypto = require("crypto");
            const names = [exe, `${exe}.sig`, "latest.json", "portable-windows-x64.zip"];
            const hashes = names.map(name => {
              const bytes = fs.readFileSync(`${dir}/${name}`);
              if (!bytes.length) throw new Error(`Empty release asset: ${name}`);
              return crypto.createHash("sha256").update(bytes).digest("hex") + "  " + name;
            });
            fs.writeFileSync(`${dir}/SHA256SUMS.txt`, hashes.join("\n") + "\n");
          ' "$VERSION" "$EXE_NAME" "$GITHUB_REPOSITORY" "$BUNDLE"
          gh release create "$TAG" --verify-tag --draft --title "AI 智能扒谱 $TAG" \
            --notes-file "docs/releases/$TAG.md" \
            "$BUNDLE/$EXE_NAME" "$BUNDLE/$EXE_NAME.sig" "$BUNDLE/latest.json" \
            "$BUNDLE/portable-windows-x64.zip" "$BUNDLE/SHA256SUMS.txt"

      - name: 草稿资产与体积复验（公开前）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./app/package.json').version")
          TAG="v$VERSION"
          EXE_NAME="AI-Guitar-Transcriber_${VERSION}_x64-setup.exe"
          gh release view "$TAG" --json isDraft,assets > release-draft-check.json
          node -e '
            const fs = require("fs");
            const [exe, dir] = process.argv.slice(1);
            const release = JSON.parse(fs.readFileSync("release-draft-check.json", "utf8"));
            if (!release.isDraft) throw new Error("Release must remain draft until verified");
            const names = [exe, `${exe}.sig`, "latest.json", "portable-windows-x64.zip", "SHA256SUMS.txt"];
            if (release.assets.length !== names.length) throw new Error("Unexpected release assets");
            for (const name of names) {
              const asset = release.assets.find(a => a.name === name);
              const size = fs.statSync(`${dir}/${name}`).size;
              if (!asset || asset.size !== size || !size) throw new Error(`Asset mismatch: ${name}`);
              if (name === exe && size > 26214400) throw new Error("Installer exceeds 25 MiB");
            }
          ' "$EXE_NAME" 'src-tauri/target/release/bundle/nsis'

      - name: 公开已验收草稿
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./app/package.json').version")
          gh release edit "v$VERSION" --draft=false --latest

      - name: latest.json 匿名可达性验证
        shell: bash
        run: |
          VERSION=$(node -p "require('./app/package.json').version")
          REPO_URL="https://github.com/$GITHUB_REPOSITORY"
          check() {
            local label="$1" url="$2" code="" tries=0
            while [ $tries -lt 8 ]; do
              if code=$(curl --connect-timeout 15 --max-time 45 -sL -o latest-check.tmp -w '%{http_code}' "$url"); then
                :
              else
                code="000"
              fi
              echo "[$label] 第 $((tries+1)) 次: HTTP $code"
              if [ "$code" = "200" ]; then break; fi
              tries=$((tries+1)); sleep 15
            done
            if [ "$code" != "200" ]; then
              echo "::error::[$label] 重试后仍 HTTP $code"
              exit 1
            fi
            node -e '
              const j = JSON.parse(require("fs").readFileSync("latest-check.tmp", "utf8"));
              const v = require("./app/package.json").version;
              if (j.version !== v) throw new Error("Updater version mismatch");
              if (!j.platforms["windows-x86_64"]?.signature) throw new Error("Missing signature");
            '
          }
          check "tag直链" "$REPO_URL/releases/download/v$VERSION/latest.json"
          check "latest链" "$REPO_URL/releases/latest/download/latest.json"
