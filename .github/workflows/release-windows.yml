name: release-windows

# Windows 原生版发布流水线（方案 §8.5）
# 推 tag（v*）→ 构建 → minisign 签名更新包 → Draft Release（NSIS + portable 绿色版 + latest.json）
# 只发 NSIS 一种安装器格式——NSIS/MSI 混装会把更新装错目录（§8.1 硬规则）

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      # fetch-depth: 0 + fetch-tags：W15-1 的 git diff 需要 app-baseline tag（浅克隆里不存在）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖（不给 app/package.json 加任何 tauri 依赖——CLI 走 npx/tauri-action）
        working-directory: app
        run: npm ci

      - name: 版本三处同源校验（app/package.json = tauri.conf.json = Cargo.toml）
        shell: bash
        run: bash src-tauri/scripts/check-versions.sh

      # ---- 首发三件套终审（§8.3/§11.2 R1+R2）：烧进二进制的 endpoint/pubkey/identifier，
      #      占位符或开发钥检出即 fail——错过首发窗口，纠正成本 = 全体用户手动重装 ----
      - name: 首发三件套终审（endpoint 占位符 / identifier / 开发钥拦截）
        shell: bash
        run: bash src-tauri/scripts/release-gate.sh

      # ---- W15 基线（§10）：直建一次，记录 app 源码与 dist 产物哈希 ----
      - name: W15 基线（app 源码哈希 + 直接构建的 dist 哈希）
        shell: bash
        run: |
          find app -type f ! -path "app/node_modules/*" ! -path "app/dist/*" -print0 \
            | sort -z | xargs -0 sha256sum > /tmp/app-src-before.sha256
          npm --prefix app run build
          find app/dist -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/dist-before.sha256

      # ---- 手动全量构建一次（CLI 钉 2.12.4，§3.1/R5：与 CI 所用版本对齐防漂移），
      #      在此完成验证门禁：验证不通过则整个 job 失败，不会创建任何 Release ----
      - name: 全量构建（NSIS + 签名更新包）
        working-directory: src-tauri
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2.12.4 build

      - name: W15 验证（app 零改动 + 前端产物 hash 一致）——Release 创建前的门禁
        shell: bash
        run: |
          # 口径①（git diff）：自迁移基线 tag 起，app/ 源码零改动。
          # 用 --name-only（纯文件列表，无汇总行）；排除 package.json——版本号三处
          # 同源是 §8.5 发版行为，由 check-versions.sh 把关。
          # `|| true` 防 set -e：有差异时 diff 退出码 1 属正常路径，交给过滤后 -s 判断。
          git diff --name-only app-baseline HEAD -- app/ > /tmp/gitdiff.txt || true
          grep -v '^app/package\.json$' /tmp/gitdiff.txt > /tmp/gitdiff-src.txt || true
          if [ -s /tmp/gitdiff-src.txt ]; then
            echo "::error::W15-1 失败：app/ 源码自 app-baseline 起被改动"
            cat /tmp/gitdiff-src.txt
            exit 1
          fi
          echo "W15-1a OK: git diff app-baseline（排除版本元数据）为空"

          find app -type f ! -path "app/node_modules/*" ! -path "app/dist/*" -print0 \
            | sort -z | xargs -0 sha256sum > /tmp/app-src-after.sha256
          diff /tmp/app-src-before.sha256 /tmp/app-src-after.sha256 \
            && echo "W15-1b OK: 构建过程 app/ 哈希前后一致"
          find app/dist -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/dist-after.sha256
          diff /tmp/dist-before.sha256 /tmp/dist-after.sha256 \
            && echo "W15-2 OK: 装进安装器的前端与直建产物 hash 一致"
          # 观察项（§11.1）：W15② 依赖 Vite 构建确定性；若偶发不一致，排查非确定性来源
          # （chunk 哈希、生成时间戳等），不得借机放宽为零改动承诺。

      - name: 安装包体积门禁（§10 性能门禁 / §11.2 R4：NSIS ≤ 25MB，不含模型权重）
        shell: bash
        run: |
          setup=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
          size=$(stat -c %s "$setup")
          echo "NSIS 体积：$((size / 1024 / 1024)) MiB（$size 字节）"
          if [ "$size" -gt 26214400 ]; then
            echo "::error::安装包超过 25MB 性能门禁（§10）：$setup" >&2
            exit 1
          fi

      # ---- 创建 Release + 上传资产 + latest.json（手动 gh，替代 tauri-action：
      #      仓库根无 package.json，tauri-action 内部 tauri build 找不到构建方式；
      #      手动构建（上方步骤）已产出全部产物，直接发布即可，不重复构建） ----
      - name: 创建 Release + 上传安装包 + latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./app/package.json').version")
          TAG="v$VERSION"
          BUNDLE="src-tauri/target/release/bundle/nsis"
          SETUP=$(ls "$BUNDLE"/*-setup.exe | head -1)
          # ASCII 文件名上传（避开中文/空格的 Release 资产 URL 编码坑）
          EXE_NAME="AI-Guitar-Transcriber_${VERSION}_x64-setup.exe"
          cp "$SETUP" "$BUNDLE/$EXE_NAME"
          cp "$SETUP.sig" "$BUNDLE/$EXE_NAME.sig"

          # 生成 latest.json（updater 检查更新用；signature = .sig 文件内容）
          node -e '
            const fs = require("fs");
            const [version, exe, repo, sigPath] = process.argv.slice(1);
            const json = {
              version,
              notes: "AI 智能扒谱 更新。变更说明见 Release 页。",
              pub_date: new Date().toISOString(),
              platforms: {
                "windows-x86_64": {
                  signature: fs.readFileSync(sigPath, "utf8").trim(),
                  url: `https://github.com/${repo}/releases/download/v${version}/${exe}`
                }
              }
            };
            fs.writeFileSync("src-tauri/target/release/bundle/nsis/latest.json", JSON.stringify(json, null, 2) + "\n");
            console.log("latest.json:", JSON.stringify(json, null, 2));
          ' "$VERSION" "$EXE_NAME" "$GITHUB_REPOSITORY" "$BUNDLE/$EXE_NAME.sig"

          NOTES=$(cat <<'EOF'
          下载下方 assets：
          - **NSIS 安装器**（.exe，推荐）：双击安装，支持自动更新与 .agtp 文件关联
          - **portable 绿色版**（.zip）：解压即用，无文件关联/无自动更新

          许可声明：前端 npm 依赖见 `app/THIRD-PARTY-NOTICES.txt`；Rust 壳工程依赖见 `src-tauri/THIRD-PARTY-NOTICES-RUST.txt`（随安装目录携带）。
          EOF
          )
          # 正式发布（latest/download/latest.json 只指向正式版——更新链的锚点）
          gh release create "$TAG" --title "AI 智能扒谱 $TAG" --notes "$NOTES" \
            "$BUNDLE/$EXE_NAME" "$BUNDLE/$EXE_NAME.sig" "$BUNDLE/latest.json" \
            || gh release upload "$TAG" --clobber \
                 "$BUNDLE/$EXE_NAME" "$BUNDLE/$EXE_NAME.sig" "$BUNDLE/latest.json"

      # ---- latest.json 公开可达性冒烟（R6 更新链的更新器视角）。
      #      GitHub 规则：releases/latest/ 只指向正式发布（prerelease/draft 不算 latest），
      #      因此 tag 直链必验；latest 链在正式发布时必验。 ----
      - name: latest.json 匿名可达性验证
        shell: bash
        run: |
          VERSION=$(node -p "require('./app/package.json').version")
          REPO_URL="https://github.com/$GITHUB_REPOSITORY"
          check() {
            local label="$1" url="$2" code="" tries=0
            # 坑1：windows-latest 的 PATH 里 curl 是 Windows 原生 curl.exe，不认 MSYS 的
            #      /tmp——-o 必须用相对路径。坑2：shell: bash 自带 set -e，
            #      `code=$(curl ...)` 失败（含写文件失败）会直接终止脚本——赋值必须
            #      放在 if 条件里保护。
            while [ $tries -lt 8 ]; do
              if code=$(curl -sL -o latest-check.tmp -w '%{http_code}' "$url"); then
                :
              else
                code="000" # curl 自身失败（写文件/网络）
              fi
              echo "[$label] 第 $((tries+1)) 次: HTTP $code"
              if [ "$code" = "200" ]; then break; fi
              tries=$((tries+1)); sleep 15
            done
            if [ "$code" != "200" ]; then
              echo "::error::[$label] 重试 8 次后仍 HTTP $code"
              rm -f latest-check.tmp
              exit 1
            fi
            node -e '
              const j = JSON.parse(require("fs").readFileSync("latest-check.tmp", "utf8"));
              const v = require("./app/package.json").version;
              if (j.version !== v) throw new Error("版本 " + j.version + " != " + v);
              if (!j.platforms["windows-x86_64"]?.signature) throw new Error("缺少签名");
              console.log("  内容校验 OK：version=" + j.version);
            '
            rm -f latest-check.tmp
          }
          check "tag直链" "$REPO_URL/releases/download/v$VERSION/latest.json"
          check "latest链" "$REPO_URL/releases/latest/download/latest.json"

      # ---- Draft Release 后体积断言复验（§11.2 R4 完成标准字面要求） ----
      - name: 体积断言复验（Draft Release 后）
        shell: bash
        run: |
          size=$(stat -c %s src-tauri/target/release/bundle/nsis/*-setup.exe)
          if [ "$size" -gt 26214400 ]; then
            echo "::error::Draft Release 附带的安装包超过 25MB 门禁，请删除本 Draft 重新排查" >&2
            exit 1
          fi
          echo "体积复验 OK：$size 字节"

      # ---- portable 绿色版（§8.1 次要分发：exe 以产品名入包） ----
      - name: 打包 portable 绿色版并附到 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem 'src-tauri/target/release' -Filter '*.exe' |
            Where-Object { $_.Name -notmatch '_script_' } |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw 'release exe not found' }
          $stage = 'portable-stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe.FullName (Join-Path $stage 'AI 智能扒谱.exe')
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath 'portable-windows-x64.zip' -Force
          Remove-Item $stage -Recurse -Force
          $tag = "v$(node -p "require('./app/package.json').version")"
          gh release upload $tag portable-windows-x64.zip --clobber
          Write-Host "portable: portable-windows-x64.zip (from $($exe.Name))"
