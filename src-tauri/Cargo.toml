[package]
name = "guitar"
version = "0.1.1"
description = "AI 智能扒谱 · Windows 原生外壳（Tauri 2）"
authors = ["dsh"]
license = "MIT"
edition = "2021"

# 版本号三处同源：app/package.json / src-tauri/tauri.conf.json / 本文件
# 用 scripts/check-versions.sh 校验（方案 §8.5）。

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
fern = "0.7" # tauri-plugin-log 的 Dispatch 扩展点（按日轮转文件 target）
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "io-util", "fs"] }
keyring = { version = "3", features = ["windows-native"] }
sha2 = "0.10"
hex = "0.4"
zip = { version = "5", default-features = false, features = ["deflate"] }
os_info = "3"
windows-sys = { version = "0.60", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
] }
